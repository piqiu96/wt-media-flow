# 视频合成任务配置
# 使用方式:
# .venv/bin/python3 src/main.py composite --batch --category 三角洲 --platform bilibili --pool pool-hz --config conf/composite.yaml

# 输入（二选一）
input_dir: data/downloads/          # 批量：处理目录下所有视频
# input_file: data/downloads/single.mp4  # 单个文件

# 引导视频
# 解析优先级：
# CLI --guide
# > conf/pools/{pool}.json categories.{category}.guides.{platform}
# > conf/pools/{pool}.json categories.{category}.guide
# > guide_by_platform.{platform}.{category}
# > guide_by_category.{category}
# > guide_video
guide_by_platform:
  bilibili:
    三角洲: data/guides/三角洲/三角洲_中国.mp4
    暗区突围: data/guides/暗区突围/暗区突围.mp4
    蛋仔派对: data/guides/蛋仔派对/蛋仔.mp4
    火影忍者: data/guides/火影忍者/火影忍者_中国.mp4
  baijiahao:
    三角洲: data/guides/三角洲/三角洲行动_中国.mp4
    暗区突围: data/guides/暗区突围/暗区6.mp4
    蛋仔派对: data/guides/蛋仔派对/蛋仔派对.mp4
    火影忍者: data/guides/火影忍者/火影手游_中国.mp4

guide_by_category:
  三角洲: data/guides/三角洲/三角洲行动_中国.mp4
  暗区突围: data/guides/暗区突围/暗区6.mp4
  蛋仔派对: data/guides/蛋仔派对/蛋仔派对.mp4
  火影忍者: data/guides/火影忍者/火影手游_中国.mp4
  洛克王国: data/guides/洛克王国/洛克王国_中国.mp4
  王者荣耀: data/guides/王者/王者.mp4
  星穹铁道: data/guides/星穹/gm8_中国.mp4
  荒野乱斗: data/guides/荒野/荒野乱斗.mp4
  光遇: data/guides/光遇/光遇.mp4
  第五人格: data/guides/第五人格/第五人格.mp4
  鸣潮: data/guides/鸣潮/鸣潮_中国.mp4

# 合成参数
#insert_at: 10                       # 插入位置（秒）
insert_range: "10-15"             # 自适应插入：在范围内找关键帧（优先于 insert_at）
# guide_duration: 5                 # 可选：只截取引导视频前 N 秒（默认使用完整引导视频）

# 去重参数
dedup: true                         # 开启视频去重（默认 true）
# overlay_dir: data/overlays/       # 尾部动画素材目录（为空则自动生成）

# 输出目录
output_dir: data/output/

# 水印配置（动态漂移水印）
# enabled: 顶层开关；platforms: 白名单（enabled=true 时只有列出的平台才判断 rules）
# rules: 每个平台的水印参数；无匹配 rule 时按默认参数渲染
watermark:
  enabled: true
  platforms: [bilibili, baijiahao]
  rules:
    - platform: bilibili
      text_source: account_name   # account_name | fixed
      # fixed_text: "固定文案"    # text_source=fixed 时生效
      style:
        fontsize: 22
        opacity: 0.25
        drift: lissajous          # lissajous | static
    - platform: baijiahao
      text_source: account_name
      style:
        fontsize: 22
        opacity: 0.25
        drift: lissajous

# 编码参数（通常不需要改，settings.py 中有默认值）
# video_codec: libx264
# audio_codec: aac
