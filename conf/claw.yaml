# 素材采集配置
# 使用方式: python src/main.py claw --category 三角洲 --config conf/claw.yaml

# 来源平台
platform: douyin

# 按品类分组的关键词库
# claw --category 三角洲 时自动取 keywords_by_category.三角洲 列表
keywords_by_category:
  三角洲:
    - "三角洲行动 白嫖"
    - "三角洲行动 免费领取"
    - "三角洲行动 限时活动"
    - "三角洲行动 活动"
    - "三角洲行动 猛攻节"
    - "三角洲行动 免费皮肤"
    - "三角洲行动 三角券"
    - "三角洲行动 赛季任务奖励"
    - "三角洲行动 活动领奖"
    - "三角洲行动 攻略"
  暗区突围:
    - "暗区突围 白嫖"
    - "暗区突围 免费领取"
    - "暗区突围 限时活动"
    - "暗区突围 活动"
    - "暗区突围 攻略"
  蛋仔派对:
    # 当前赛季（S30 元气零食季）
    - "蛋仔派对S30"
    - "蛋仔派对新赛季"
    - "蛋仔派对元气零食季"
    - "蛋仔S30隐藏皮肤"
    - "蛋仔派对彩虹币"
    - "蛋仔派对盲盒"
    # 攻略向
    - "蛋仔派对攻略"
    - "蛋仔派对新地图"
    - "蛋仔派对速通"
    - "蛋仔派对异色"
    # 活动/福利向
    - "蛋仔派对免费皮肤"
    - "蛋仔派对活动奖励"
    - "蛋仔派对登录奖励"
    - "蛋仔派对联动"

# 搜索参数（全局默认，可被 CLI 参数覆盖）
count: 30          # 每个关键词采集数量
sort_type: 2       # 0综合 1点赞 2最新
publish_time: 1    # 0不限 1一天 7七天 182半年
filter_duration: "1-5"  # 视频时长筛选
content_type: 1    # 1视频 2图文
